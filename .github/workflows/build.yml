name: Build EmuConsole Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate AndroidManifest.xml and base resources
        run: |
          mkdir -p app/src/main/res/values
          python3 -c '
          a = "android"
          c = chr(58)
          p = a + c

          strings = "<resources><string name=\"app_name\">EmuConsole</string></resources>"
          open("app/src/main/res/values/strings.xml", "w").write(strings)

          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns{c}{a}="http://android.com">
              <uses-permission {p}name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  {p}allowBackup="true"
                  {p}label="@string/app_name"
                  {p}supportsRtl="true"
                  {p}theme="@{a}{c}style/Theme.Material.NoActionBar.Fullscreen">
                  <activity
                      {p}name=".MainActivity"
                      {p}exported="true"
                      {p}launchMode="singleTask"
                      {p}stateNotNeeded="true"
                      {p}screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action {p}name="android.intent.action.MAIN" />
                          <category {p}name="android.intent.category.HOME" />
                          <category {p}name="android.intent.category.DEFAULT" />
                          <category {p}name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)
          '

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmuConsole-debug
          path: app/build/outputs/apk/debug/app-debug.apk
