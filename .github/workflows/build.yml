name: Build EmuConsole Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate AndroidManifest.xml and base resources
        run: |
          rm -f app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/res/values
          python3 -c '
          import xml.etree.ElementTree as ET

          ns = "http://android.com"
          ET.register_namespace("android", ns)
          k_name = "{" + ns + "}" + "".join(["n","a","m","e"])

          res = ET.Element("resources")
          st = ET.SubElement(res, "string", {"".join(["n","a","m","e"]): "app_name"})
          st.text = "EmuConsole"
          ET.ElementTree(res).write("app/src/main/res/values/strings.xml", encoding="utf-8")

          m = ET.Element("manifest")
          ET.SubElement(m, "uses-permission", {k_name: "android.permission.QUERY_ALL_PACKAGES"})

          app = ET.SubElement(m, "application", {
              "{" + ns + "}allowBackup": "true",
              "{" + ns + "}label": "@string/app_name",
              "{" + ns + "}supportsRtl": "true",
              "{" + ns + "}theme": "@android:style/Theme.Material.NoActionBar.Fullscreen"
          })

          act = ET.SubElement(app, "activity", {
              k_name: ".MainActivity",
              "{" + ns + "}exported": "true",
              "{" + ns + "}launchMode": "singleTask",
              "{" + ns + "}stateNotNeeded": "true",
              "{" + ns + "}screenOrientation": "sensorLandscape"
          })

          flt = ET.SubElement(act, "intent-filter")
          ET.SubElement(flt, "action", {k_name: "android.intent.action.MAIN"})
          ET.SubElement(flt, "category", {k_name: "android.intent.category.HOME"})
          ET.SubElement(flt, "category", {k_name: "android.intent.category.DEFAULT"})
          ET.SubElement(flt, "category", {k_name: "android.intent.category.LAUNCHER"})

          ET.ElementTree(m).write("app/src/main/AndroidManifest.xml", encoding="utf-8", xml_declaration=True)
          '
          cat app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmuConsole-debug
          path: app/build/outputs/apk/debug/app-debug.apk
